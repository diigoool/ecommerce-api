services:
  postgres:
    image: postgres:16
    container_name: shared-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: ecommerce-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres
